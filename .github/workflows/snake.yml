name: Update Animation
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          date > animation.txt
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Update animation"
          git push
